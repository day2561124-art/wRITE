name: Project validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Validation tier
        required: true
        default: full
        type: choice
        options:
          - full
          - certification

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Affected PR verification
        run: >-
          node tests/run-ci-affected.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  cross-platform-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: windows-latest
            node: 18
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: node tests/ci-change-detection.test.mjs
      - run: node tests/test-classification.test.mjs
      - run: node tests/test-suite-groups.test.mjs
      - run: node tests/affected-test-selector.test.mjs
      - run: node tests/test-runner-core.test.mjs
      - run: node tests/ci-layering.test.mjs
      - run: node tests/ci-selection-audit.test.mjs
      - run: node tests/verification-telemetry.test.mjs
      - run: node tests/cache-telemetry.test.mjs

  main-regression:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: node tests/run-all.mjs

  scheduled-full:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
            selector_audit: false
          - os: windows-latest
            node: 18
            selector_audit: false
          - os: ubuntu-latest
            node: 24
            selector_audit: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - name: Resolve scheduled selector-audit base
        if: matrix.selector_audit == true
        shell: bash
        run: |
          BASE_SHA="$(git rev-list --first-parent --max-count=21 HEAD | tail -n 1)"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$GITHUB_SHA" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "VA13_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
      - name: Scheduled affected/full selector audit
        if: matrix.selector_audit == true
        run: >-
          node tests/ci-selection-audit.mjs
          --base "${{ env.VA13_BASE_SHA }}"
          --head "${{ github.sha }}"
      - name: Scheduled full regression
        if: matrix.selector_audit == false
        run: node tests/run-all.mjs
      - name: Aggregate completed selector evidence
        if: ${{ always() && matrix.selector_audit == true }}
        shell: bash
        run: |
          if [ -f tests/.tmp/ci-selection-audit.last.json ]; then
            node tests/run-verification-telemetry.mjs --audit tests/.tmp/ci-selection-audit.last.json > tests/.tmp/ci-selection-telemetry.last.json
          fi
      - name: Retain scheduled selector evidence
        if: ${{ always() && matrix.selector_audit == true }}
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-selector-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.tmp/ci-selection-audit.last.json
            tests/.tmp/ci-selection-telemetry.last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  manual-full:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: windows-latest
            node: 18
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: node tests/run-all.mjs
      - name: Explicit certification audit
        if: inputs.mode == 'certification'
        run: node tests/certification/character-memory-core-certification.test.mjs
