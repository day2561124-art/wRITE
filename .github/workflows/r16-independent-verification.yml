name: R16 independent verification evidence

# Fixture verification only; no production signer, secret or deployment.
on:
  pull_request:
    branches: [nexa/r16-lifecycle-contract, nexa/r16-independent-verification, nexa/r16-candidate-evidence-binding, main]
    paths:
      - 'server/src/mcp-independent-verification-*.mjs'
      - 'tests/mcp/mcp-independent-verification-evidence.test.mjs'
      - 'server/src/mcp-development-integration-tools.mjs'
      - 'tests/mcp/mcp-development-integration-tools.test.mjs'
      - '.github/workflows/r16-independent-verification.yml'
permissions:
  contents: read
concurrency:
  group: r16-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - run: npm ci
      - name: Verify exact checked-out evidence consumer
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node -e "const a=require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(a!==process.env.EXPECTED_HEAD)process.exit(1);console.log(a)"
      - run: node --test tests/mcp/mcp-independent-verification-evidence.test.mjs
      - run: node --test --test-name-pattern="R16 independent (candidate evidence|adoption)" tests/mcp/mcp-development-integration-tools.test.mjs
      - run: node --test tests/mcp/pi-integration-preflight-resolution.test.mjs
