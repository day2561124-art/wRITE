name: Testimony revision focused check
on:
  push:
    branches:
      - fix/testimony-revision-memory
jobs:
  native-testimony:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node tests/communication/observer-dialogue-testimony-revision.test.mjs
      - run: node tests/communication/observer-dialogue-native-revision.test.mjs
