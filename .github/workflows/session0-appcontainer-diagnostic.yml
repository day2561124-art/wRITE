name: Session 0 AppContainer diagnosis

# Disposable hosted runner only. Not a production deployment or grant test.
on:
  pull_request:
    branches: [nexa/unified-engineering-ingress]
permissions:
  contents: read

concurrency:
  group: session0-diag-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  session0:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Compare existing fixed test in runner and limited Password task
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_HEAD) { throw 'Candidate mismatch' }
          Write-Output "Candidate HEAD: $actual"
          Write-Output 'PER_RUN_LEASE_FIXTURE_V1; diagnostic comparison only; no production deployment'
          $suffix = [guid]::NewGuid().ToString('N').Substring(0,12)
          $root = Join-Path $env:SystemDrive "NexaDiag-$suffix"
          $account = "NexaDiag$suffix"
          $task = "NexaSession0Diag-$suffix"
          $createdUser = $false
          $createdTask = $false
          $createdProvisioner = $false
          $provisionTask = "$task-station"
          $batchPolicyChanged = $false
          $observed = $null
          try {
            $null = New-Item -ItemType Directory -Path $root
            # Never run the SYSTEM fixture from a location writable by the
            # standard test user or guest. Remove inherited root permissions
            # before writing any executable; only the run subtree is writable.
            icacls $root /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)(F)' '*S-1-5-32-544:(OI)(CI)(F)' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Fixture root protection failed' }
            $source = Join-Path $root 'source'
            $tools = Join-Path $root 'tools'
            $run = Join-Path $root 'run'
            $null = New-Item -ItemType Directory -Path $source,$tools,$run
            $archive = Join-Path $root 'source.zip'
            git archive --format=zip --output=$archive $actual
            if ($LASTEXITCODE -ne 0) { throw 'Fixture archive failed' }
            Expand-Archive -LiteralPath $archive -DestinationPath $source
            $nodeDir = Split-Path (Get-Command node.exe -ErrorAction Stop).Source
            robocopy $nodeDir $tools /E /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw 'Fixture toolchain copy failed' }
            $node = Join-Path $tools 'node.exe'
            $npm = Join-Path $tools 'node_modules\npm\bin\npm-cli.js'
            $env:Path = "$tools;$env:Path"
            & $node $npm ci --prefix $source --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Fixture dependency install failed' }
            $pattern = 'fixed hermetic suite (executes|denies)'
            $test = Join-Path $source 'tests\mcp\pi-workspace-appcontainer.test.mjs'
            $runnerSession = (Get-Process -Id $PID).SessionId
            $runnerAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            Write-Output "BASELINE_SESSION=$runnerSession; BASELINE_ADMIN=$runnerAdmin; NODE=$(& $node --version)"
            & $node --test --test-name-pattern $pattern $test
            $baseline = $LASTEXITCODE
            Write-Output "BASELINE_TEST_EXIT=$baseline"

            # Fresh local standard user, only on this ephemeral CI VM.
            # The random credential is never printed, persisted as an artifact or passed to the test.
            $password = 'Nexa!9a-' + [guid]::NewGuid().ToString('N')
            $secure = ConvertTo-SecureString -String $password -AsPlainText -Force
            $user = New-LocalUser -Name $account -Password $secure -Description 'Disposable Nexa Session 0 diagnostic'
            $createdUser = $true
            $sid = $user.SID.Value
            # 0x80070569 on previous runs: the disposable account lacks batch logon.
            # Grant that one logon type to this one temporary CI SID. Preserve all
            # existing entries and restore the original list in finally. This is
            # not a change to Nexa's production account or any AppContainer ACL.
            $policy = Join-Path $root 'original-rights.inf'
            secedit /export /cfg $policy /areas USER_RIGHTS /quiet
            if ($LASTEXITCODE -ne 0) { throw 'Fixture rights export failed' }
            $line = @(Get-Content -LiteralPath $policy | Where-Object { $_ -match '^SeBatchLogonRight\s*=' })
            if ($line.Count -gt 1) { throw 'Ambiguous batch-logon policy' }
            $originalBatch = if ($line.Count -eq 1) { ($line[0] -split '=',2)[1].Trim() } else { '' }
            $entries = @($originalBatch -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            $newBatch = (@($entries) + "*$sid") -join ','
            function Set-FixtureBatchRight([string]$Value, [string]$Label) {
              $inf = Join-Path $root "$Label.inf"
              $db = Join-Path $root "$Label.sdb"
              @('[Unicode]', 'Unicode=yes', '[Version]', 'signature="$CHICAGO$"', 'Revision=1', '[Privilege Rights]', "SeBatchLogonRight = $Value") |
                Set-Content -LiteralPath $inf -Encoding Unicode
              secedit /configure /db $db /cfg $inf /areas USER_RIGHTS /quiet
              if ($LASTEXITCODE -ne 0) { throw "Fixture batch-logon $Label failed" }
            }
            $batchPolicyChanged = $true
            Set-FixtureBatchRight $newBatch 'fixture-batch-grant'
            icacls $root /grant:r "*${sid}:(OI)(CI)(RX)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Fixture read ACL failed' }
            icacls $run /grant:r "*${sid}:(OI)(CI)(M)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Fixture run ACL failed' }

            # A bounded, CI-only SYSTEM process creates only new station/desktop
            # objects. Its binary and control files are outside the user's
            # writable run directory. It never launches the guest or accepts code.
            $provisioner = Join-Path $root 'station-fixture.exe'
            $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            & $csc /nologo /target:exe /platform:x64 "/out:$provisioner" (Join-Path $source 'tests\fixtures\session0-station-lease-provider.cs')
            if ($LASTEXITCODE -ne 0) { throw 'Station fixture compilation failed' }
            $provisionArgs = '"' + $sid + '" "' + $root + '"'
            $provisionAction = New-ScheduledTaskAction -Execute $provisioner -Argument $provisionArgs -WorkingDirectory $root
            $provisionPrincipal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
            $provisionSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
            $null = Register-ScheduledTask -TaskName $provisionTask -Action $provisionAction -Principal $provisionPrincipal -Settings $provisionSettings
            $createdProvisioner = $true
            Start-ScheduledTask -TaskName $provisionTask
            $stationDeadline = [datetime]::UtcNow.AddSeconds(75)
            while (!(Test-Path -LiteralPath (Join-Path $root 'station-ready.txt'))) {
              if (Test-Path -LiteralPath (Join-Path $root 'station-error.txt')) {
                Get-Content -LiteralPath (Join-Path $root 'station-error.txt')
                throw 'Independent station fixture failed'
              }
              if ([datetime]::UtcNow -gt $stationDeadline) {
                Get-ScheduledTaskInfo -TaskName $provisionTask | Select-Object LastRunTime,LastTaskResult | Format-List
                throw 'Independent station fixture not ready'
              }
              Start-Sleep -Seconds 1
            }
            Get-Content -LiteralPath (Join-Path $root 'station-ready.txt')
            $script = Join-Path $root 'probe.ps1'
            @'
          param([Parameter(Mandatory=$true)][string]$Root)
          $ErrorActionPreference = 'Stop'
          $run = Join-Path $Root 'run'
          [IO.File]::WriteAllText((Join-Path $run 'probe-entered.txt'), 'entered')
          $node = Join-Path $Root 'tools\node.exe'
          $test = Join-Path $Root 'source\tests\mcp\pi-workspace-appcontainer.test.mjs'
          $env:TEMP = $run
          $env:TMP = $run
          $env:Path = (Join-Path $Root 'tools') + ';' + $env:Path
          $session = (Get-Process -Id $PID).SessionId
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $result = [ordered]@{ session_id=$session; administrator=$admin; node_version=$null; test_exit=$null; station_probe=$null; error=$null }
          try {
            if ($session -ne 0 -or $admin) { throw 'Expected limited Session 0' }
            $result.node_version = (& $node --version)
            if ($LASTEXITCODE -ne 0) { throw 'Host Node version probe failed' }
            # Query-only compatibility probe; never change an existing window
            # station/desktop, its security descriptor, or the current station.
            Add-Type -TypeDefinition @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class StationProbe {
            [DllImport("user32.dll", SetLastError=true)] static extern IntPtr GetProcessWindowStation();
            [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern IntPtr CreateWindowStation(string name, uint flags, uint access, IntPtr security);
            [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern bool GetUserObjectInformation(IntPtr handle, int index, StringBuilder value, uint bytes, out uint required);
            [DllImport("user32.dll", SetLastError=true)] static extern bool CloseWindowStation(IntPtr handle);
            static string Name(IntPtr handle) {
              var value = new StringBuilder(512); uint required;
              if (!GetUserObjectInformation(handle, 2, value, 1024, out required)) return "query-error:" + Marshal.GetLastWin32Error();
              return value.ToString();
            }
            public static string Probe(bool named) {
              IntPtr current = GetProcessWindowStation();
              string existing = Name(current);
              IntPtr candidate = CreateWindowStation(named ? "NexaProbe" + Guid.NewGuid().ToString("N") : null, 0, 0x0002, IntPtr.Zero);
              int error = Marshal.GetLastWin32Error();
              if (candidate == IntPtr.Zero) return "current=" + existing + "; creation_error=" + error;
              try { return "current=" + existing + "; candidate=" + Name(candidate) + "; distinct=" + (!String.Equals(existing, Name(candidate), StringComparison.OrdinalIgnoreCase)); }
              finally { CloseWindowStation(candidate); }
            }
          }
          "@
            $result.station_probe = [ordered]@{ unnamed=[StationProbe]::Probe($false); named=[StationProbe]::Probe($true) }
            $pattern = 'fixed hermetic suite (executes|denies)'
            # Start-Process retains native stderr separately from PowerShell 5.1
            # error records, so a failing test still yields a complete result.
            $arguments = '--test --test-name-pattern "' + $pattern + '" "' + $test + '"'
            $process = Start-Process -FilePath $node -ArgumentList $arguments -RedirectStandardOutput (Join-Path $run 'test.log') -RedirectStandardError (Join-Path $run 'test-stderr.log') -Wait -PassThru -NoNewWindow
            $result.test_exit = $process.ExitCode
          } catch {
            $result.error = $_.Exception.Message
          } finally {
            $tmp = Join-Path $run 'result.tmp'
            $result | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $tmp -Encoding UTF8
            Move-Item -LiteralPath $tmp -Destination (Join-Path $run 'result.json')
          }
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
            $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            # Capture failures before the PowerShell script can write its own result.
            # The wrapper contains only fixed fixture paths on the disposable runner.
            $wrapper = Join-Path $root 'probe.cmd'
            @(
              '@echo off'
              ('echo entered>"' + (Join-Path $run 'wrapper-entered.txt') + '"')
              ('"' + $exe + '" -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "' + $script + '" -Root "' + $root + '" >"' + (Join-Path $run 'bootstrap.log') + '" 2>&1')
              ('echo %ERRORLEVEL%>"' + (Join-Path $run 'wrapper-exit.txt') + '"')
              'exit /b %ERRORLEVEL%'
            ) | Set-Content -LiteralPath $wrapper -Encoding ASCII
            $cmd = Join-Path $env:SystemRoot 'System32\cmd.exe'
            $arguments = '/d /c ""' + $wrapper + '""'
            $action = New-ScheduledTaskAction -Execute $cmd -Argument $arguments -WorkingDirectory $source
            # Only the disposable fixture task gets explicit scheduling settings.
            # No production policy changes; the temporary SID alone has batch logon.
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(10)
            $null = Register-ScheduledTask -TaskName $task -Action $action -Trigger $trigger -Settings $settings -User "$env:COMPUTERNAME\$account" -Password $password -RunLevel Limited
            $createdTask = $true
            $password = $null
            $secure.Dispose()
            $principal = (Get-ScheduledTask -TaskName $task).Principal
            if ([string]$principal.LogonType -ne 'Password' -or [string]$principal.RunLevel -ne 'Limited') { throw 'Task principal mismatch' }
            # Enable event history on this disposable CI VM, not on the production host.
            wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
            if ($LASTEXITCODE -ne 0) { throw 'Unable to enable disposable fixture task history' }
            $registered = Get-ScheduledTask -TaskName $task
            $registered.Settings | Select-Object Enabled,AllowDemandStart,DisallowStartIfOnBatteries,RunOnlyIfIdle,RunOnlyIfNetworkAvailable | Format-List
            $start = Get-Date
            $prior = (Get-ScheduledTaskInfo -TaskName $task).LastRunTime
            Start-ScheduledTask -TaskName $task -ErrorAction Stop
            $deadline = [datetime]::UtcNow.AddMinutes(5)
            $resultPath = Join-Path $run 'result.json'
            while (!(Test-Path -LiteralPath $resultPath)) {
              $info = Get-ScheduledTaskInfo -TaskName $task
              $state = (Get-ScheduledTask -TaskName $task).State
              if (($info.LastRunTime -ne $prior -and $state -eq 'Ready') -or
                  (Test-Path -LiteralPath (Join-Path $run 'wrapper-exit.txt')) -or
                  [datetime]::UtcNow -gt $deadline) {
                Write-Output "TASK_STATE=$state; LAST_RUN_RESULT=$($info.LastTaskResult); LAST_RUN_TIME=$($info.LastRunTime)"
                foreach ($name in @('wrapper-entered.txt','probe-entered.txt','wrapper-exit.txt','bootstrap.log','test.log')) {
                  $file = Join-Path $run $name
                  Write-Output "DIAGNOSTIC_FILE=$name; EXISTS=$(Test-Path -LiteralPath $file)"
                  if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file -Tail 40 }
                }
                Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-TaskScheduler/Operational';StartTime=$start} -ErrorAction SilentlyContinue |
                  Where-Object { $_.Message -like "*$task*" } |
                  Select-Object -First 12 TimeCreated,Id,Message | Format-List
                throw 'Session 0 probe ended or timed out without result'
              }
              Start-Sleep -Seconds 2
            }
            $observed = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            $observed | ConvertTo-Json -Depth 4
            $log = Join-Path $run 'test.log'
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            $errLog = Join-Path $run 'test-stderr.log'
            if (Test-Path -LiteralPath $errLog) { Get-Content -LiteralPath $errLog }
            if ($observed.error -or $observed.session_id -ne 0 -or $observed.administrator -or $null -eq $observed.test_exit) { throw 'Session 0 probe not completed' }
            if ($baseline -ne 0 -or $observed.test_exit -ne 0) { throw "Observed test failure: baseline=$baseline; limited_session0=$($observed.test_exit)" }
          } finally {
            if ($createdTask) {
              Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
              Unregister-ScheduledTask -TaskName $task -Confirm:$false
            }
            try {
              if ($createdProvisioner) {
                Set-Content -LiteralPath (Join-Path $root 'station-stop.txt') -Value 'stop' -Encoding ASCII
                $stopDeadline = [datetime]::UtcNow.AddSeconds(15)
                while (!(Test-Path -LiteralPath (Join-Path $root 'station-stopped.txt')) -and [datetime]::UtcNow -lt $stopDeadline) {
                  Start-Sleep -Seconds 1
                }
                $stopped = Join-Path $root 'station-stopped.txt'
                if (Test-Path -LiteralPath $stopped) { Get-Content -LiteralPath $stopped }
                Stop-ScheduledTask -TaskName $provisionTask -ErrorAction SilentlyContinue
                Unregister-ScheduledTask -TaskName $provisionTask -Confirm:$false
                $leaseLog = Join-Path $root 'station-leases.log'
                if (Test-Path -LiteralPath $leaseLog) { Get-Content -LiteralPath $leaseLog }
                if ($observed -and $observed.test_exit -eq 0) {
                  $lines = @(Get-Content -LiteralPath $leaseLog)
                  $acquired = @($lines | Where-Object { $_ -match '^acquired=[0-9a-f]{32}; package=S-1-15-2-' })
                  $closed = @($lines | Where-Object { $_ -match '^closed=[0-9a-f]{32}; released=True; cleaned=True
                  throw 'Independent station fixture cleanup not verified'
                }
              }
            } finally {
              try {
                if ($batchPolicyChanged) { Set-FixtureBatchRight $originalBatch 'fixture-batch-restore' }
              } finally {
                if ($createdUser) { Remove-LocalUser -Name $account }
              }
            }
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
 })
                  $ids = @($acquired | ForEach-Object { ($_ -split '[=;]')[1] })
                  $packages = @($acquired | ForEach-Object { ($_ -split 'package=')[1] })
                  $closedIds = @($closed | ForEach-Object { ($_ -split '[=;]')[1] })
                  if ($ids.Count -ne 3 -or @($ids | Sort-Object -Unique).Count -ne 3 -or @($packages | Sort-Object -Unique).Count -ne 3 -or
                      $closedIds.Count -ne 3 -or (Compare-Object ($ids | Sort-Object) ($closedIds | Sort-Object))) {
                    throw 'Expected three distinct single-use leases with verified normal cleanup'
                  }
                  Write-Output 'PER_RUN_LEASE_IDENTITY_AND_CLEANUP_PASS'
                }
                if (!(Test-Path -LiteralPath $stopped) -or (Get-Content -LiteralPath $stopped -Raw).Trim() -ne 'exit=0') {
                  throw 'Independent station fixture cleanup not verified'
                }
              }
            } finally {
              try {
                if ($batchPolicyChanged) { Set-FixtureBatchRight $originalBatch 'fixture-batch-restore' }
              } finally {
                if ($createdUser) { Remove-LocalUser -Name $account }
              }
            }
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
