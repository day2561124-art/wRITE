name: Corroborated recall focused check
on:
  push:
    branches:
      - fix/corroborated-memory-recall
jobs:
  memory-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node tests/communication/observer-dialogue-corroborated-recall.test.mjs
      - run: node tests/communication/observer-dialogue-source-uncertainty.test.mjs
      - run: node tests/communication/observer-dialogue-testimony-revision.test.mjs
